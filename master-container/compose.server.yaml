# Master connection settings for /home/nick/CC/docker-compose.yml.
# deploy.py always includes this override so the Video host mapping is retained.
services:
  master-api:
    environment:
      MASTER_API_CLIENT_MODE: http
      MASTER_API_CONTROLLER_BASE_URL: http://controller-api:8002
      MASTER_API_VIDEO_BASE_URL: http://host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
