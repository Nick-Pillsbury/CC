services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  api:
    build: .
    network_mode: host
    devices:
      - /dev/video0:/dev/video0
    environment:
      CAMERA_DEVICE: /dev/video0
      VIDEO_SIZE: 1920x1080
      FRAMERATE: "30"
      BITRATE: 6M
      BUFSIZE: 6M
      RTSP_PORT: "8554"
    depends_on:
      - mediamtx
    restart: unless-stopped